name: Atualização de ocupação (manual / referência)

# O agendamento automático (cron) foi removido daqui: o Airbnb bloqueia os
# IPs de datacenter usados pelos runners do GitHub Actions (ver seção
# "Por que rodar localmente" no README). A atualização diária agora roda no
# seu computador via scripts/run_local.sh (Mac/Linux) ou
# scripts/run_local.ps1 (Windows), agendado por cron ou Task Scheduler.
#
# Este workflow fica só como atalho manual (Actions → Run workflow) para o
# caso de você configurar um runner self-hosted no futuro — rodando em um
# runner hospedado pelo GitHub, é bem provável que dê o mesmo erro de
# bloqueio anti-bot.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-occupancy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar disponibilidade dos anúncios
        run: python scripts/fetch_availability.py

      - name: Upload do HTML de depuração (se houve falha em algum anúncio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit e push dos dados atualizados (se rodado manualmente)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/occupancy.json
          git diff --quiet --cached || git commit -m "Atualização diária de ocupação [skip ci]"
          git push
