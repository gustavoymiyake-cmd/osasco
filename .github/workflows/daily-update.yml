name: Atualização diária de ocupação

on:
  schedule:
    # 06:00 UTC = 03:00 no horário de Brasília (UTC-3). Ajuste se preferir outro horário.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-occupancy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar disponibilidade dos anúncios
        run: python scripts/fetch_availability.py

      - name: Upload do HTML de depuração (se houve falha em algum anúncio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit e push dos dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/occupancy.json
          git diff --quiet --cached || git commit -m "Atualização diária de ocupação [skip ci]"
          git push
